<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Upload → HLS AES-128 Player</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 2rem;
      }

      iframe {
        border: none;
        width: 720px;
        height: 405px;
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <h1>Upload video and convert to HLS (AES-128)</h1>
    <form
      id="uploadForm"
      action="/upload"
      method="post"
      enctype="multipart/form-data"
    >
      <label
        >Video file:
        <input type="file" name="video" accept="video/*" required /> </label
      ><br /><br />
      <label
        >Video processing:
        <select name="mode">
          <option value="copy" selected>Giữ nguyên chất lượng — không nén lại</option>
          <option value="transcode">Nén lại H.264 / AAC (có mất chất lượng)</option>
        </select></label
      ><br />
      <p>
        Chế độ giữ nguyên không nén lại video hoặc âm thanh. Khả năng phát phụ
        thuộc codec gốc; H.264 / AAC phù hợp nhất với player hiện tại.
        Độ dài segment thực tế phụ thuộc các keyframe có sẵn trong video.
      </p>
      <label
        >Segment duration (sec):
        <input type="number" name="seg" value="10" min="2" max="10" /></label
      ><br /><br />
      <button type="submit">Upload & Convert</button>
    </form>

    <div id="result"></div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
      const form = document.getElementById("uploadForm");
      const result = document.getElementById("result");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = new FormData(form);
        result.innerHTML = "<p>Processing, please wait...</p>";

        try {
          const res = await fetch("/upload", { method: "POST", body: data });
          const html = await res.text();
          if (res.ok) result.innerHTML = html;
          else result.textContent = html;
        } catch (error) {
          result.textContent = `Upload failed: ${error.message}`;
        }
      });

      function showPlayer(url) {
        const match = url.match(/(\/)?hls\/([^/]+)\//);
        const key = match ? match[2] : null;
        const div = document.createElement("div");
        div.className = "player";
        div.innerHTML = `<iframe src="/player.html?key=${key}" />`;
        result.appendChild(div);
      }

      showPlayer("/hls/demo/master.m3u8");
    </script>
  </body>
</html>
